<!DOCTYPE html>
<html lang="pt" data-lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiência | Benjamin Hejda</title>
  <meta name="description" content="Experiência – portfólio de Benjamin Hejda, estudante, atleta e explorador checo." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230066cc'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EBH%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    .jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .job .icon { font-size: 1.8rem; line-height: 1; margin-bottom: 12px; }
    .job h2 { font-size: 1.2rem; margin-bottom: 4px; }
    .job .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    .job p { color: #3a414a; }
    .skill-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin-top: 16px; }
    @media (max-width: 600px) {
      .jobs { grid-template-columns: 1fr; gap: 12px; }
      .job { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; }
      .job .icon { grid-row: span 4; font-size: 1.6rem; margin: 2px 0 0; }
      .job h2 { font-size: 1.08rem; }
      .job .meta { margin-bottom: 8px; font-size: 0.85rem; }
      .job p { font-size: 0.93rem; }
      .job .more-hint { margin-top: 8px; }
    }
    .modal-content .meta a { color: inherit; }
  </style>
</head>
<body data-page="experience">
  <!-- The burger menu is added automatically by assets/site.js -->

<header class="page-header has-image" style="--hero: url('https://i.imgur.com/Tpt260a.jpeg')">
    <h1>Experiência</h1>
    <p class="lead">Clique num cartão para ver a história completa.</p>
  </header>

  <main>
    <div class="wrap">
      <div class="jobs" id="jobs"></div>
    </div>
  </main>

  <footer class="site-footer">© 2026 Benjamin Hejda</footer>

  <script src="assets/site.js"></script>
  <script>
    // Each job: short "summary" shows on the card, "details" + "image" show when clicked.
    const jobs = [
      {"icon":"🏉","role":"Treinador Voluntário de Rugby","org":"Ragby Plzeň","link":"https://www.ragbyplzen.cz/","period":"2022–Presente","summary":"Treino uma equipa de crianças dos 10 aos 12 anos no meu clube de rugby em Pilsen.","details":"Treino uma equipa de crianças entre os 10 e os 12 anos, com foco no desenvolvimento de competências, disciplina e espírito de equipa. Organizei também dois acampamentos de sobrevivência onde as crianças aprenderam competências essenciais ao ar livre e de trabalho em equipa através de desafios divertidos. A foto é do meu primeiro torneio como treinador.","skills":["Mentoria juvenil","Liderança de equipa","Planeamento de programas"],"image":"https://i.imgur.com/43lO1pf.jpeg"},
      {"icon":"🏕️","role":"Treinador & Animador de Campo","org":"Rugby Academy Yves Perrot (RAYP)","link":"https://www.sportbezpredsudku.cz/ragbyova-akademie-yvese-perrota/","period":"Sazonal","summary":"Ajudo nos treinos e no dia a dia de um campo de uma academia de rugby juvenil.","details":"Apoio no treino físico de crianças de várias idades e participo no dia a dia do campo – desde os treinos da manhã aos jogos da noite. Crio atividades dinâmicas que incentivam a resiliência e a colaboração.","skills":["Treino","Organização de campos","Trabalho com crianças"],"image":"https://i.imgur.com/jLSE58G.jpeg"},
      {"icon":"🎯","role":"Funcionário","org":"Paintball Arena (PPA)","link":"https://www.pparena.com/","period":"2023–Presente","summary":"Jogos, equipamento e instruções de segurança numa arena de paintball.","details":"Atendo clientes durante os jogos, giro o equipamento e dou as instruções de segurança. É um ambiente dinâmico, por isso um serviço simpático e resolver problemas rapidamente é essencial.","skills":["Atendimento ao cliente","Gestão de equipamento","Resolução de problemas"],"image":null},
      {"icon":"🍴","role":"Marketing de Eventos & Catering","org":"4PRO","link":"https://www.4pro.cz/","period":"2024–Presente","summary":"Bancas de comida e bebida em jogos de futebol, concertos e eventos.","details":"Ajudo a organizar e gerir bancas de comida e bebida em jogos de futebol, concertos e outros eventos. O foco é um atendimento rápido e cordial mesmo em momentos de grande procura, muitas vezes acumulando a montagem ou a limpeza.","skills":["Operações de eventos","Serviço de restauração","Trabalho em equipa sob pressão"],"image":null},
      {"icon":"🎸","role":"Vendedor / Apoio","org":"Vários concertos & festivais","link":null,"period":"Ocasional","summary":"Venda de comida e bebidas e apoio na montagem em concertos e festivais.","details":"Em vários concertos e festivais vendo comida e bebidas, atendo um público muito diverso, faço pagamentos em dinheiro e digitais e ajudo a montar as estruturas temporárias dos eventos.","skills":["Vendas","Logística de festivais","Adaptabilidade"],"image":null}
    ];
    const MORE = "Ler mais →";
    const esc = Site.escape;
    const list = document.getElementById('jobs');
    
    list.innerHTML = jobs.map((j, i) =>
      '<button class="card clickable job" type="button" data-index="' + i + '">' +
      '<div class="icon">' + j.icon + '</div>' +
      '<h2>' + esc(j.role) + '</h2>' +
      '<div class="meta">' + esc(j.org) + ' · ' + esc(j.period) + '</div>' +
      '<p>' + esc(j.summary) + '</p>' +
      '<div class="more-hint">' + MORE + '</div></button>'
    ).join('');
    
    list.addEventListener('click', e => {
      const card = e.target.closest('.job');
      if (!card) return;
      const j = jobs[card.dataset.index];
      const org = j.link ? '<a href="' + j.link + '" target="_blank" rel="noopener">' + esc(j.org) + ' ↗</a>' : esc(j.org);
      Site.openModal(
        (j.image ? '<img class="modal-img" src="' + j.image + '" alt="' + esc(j.role) + '">' : '') +
        '<div class="modal-content"><h2>' + j.icon + ' ' + esc(j.role) + '</h2>' +
        '<div class="sub meta">' + org + ' · ' + esc(j.period) + '</div>' +
        '<p>' + esc(j.details) + '</p>' +
        '<ul class="skill-list">' + j.skills.map(s => '<li class="pill">' + esc(s) + '</li>').join('') + '</ul></div>'
      );
    });
  </script>
</body>
</html>
