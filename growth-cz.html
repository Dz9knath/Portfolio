<!DOCTYPE html>
<html lang="cs" data-lang="cz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Růst a vzdělávání | Benjamin Hejda</title>
  <meta name="description" content="Růst a vzdělávání – portfolio Benjamina Hejdy, českého studenta, sportovce a dobrodruha." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230066cc'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EBH%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    .intro { text-align: center; font-size: 1.15rem; max-width: 760px; margin: 0 auto 20px; }
    .quote { text-align: center; font-style: italic; color: var(--muted); margin: 0 auto 28px; max-width: 760px; min-height: 3em; }
    .filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 32px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .cards .card h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .cards .card p { color: #3a414a; font-size: 0.95rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .cards .card[hidden] { display: none; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    @media (max-width: 600px) {
      .intro { font-size: 1rem; }
      .quote { font-size: 0.9rem; margin-bottom: 18px; }
      .filter-bar { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; margin: 0 -16px 18px; padding: 4px 16px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
      .filter-bar::-webkit-scrollbar { display: none; }
      .filter-bar .btn { flex: 0 0 auto; white-space: nowrap; padding: 8px 16px; min-height: 40px; border-radius: 999px; scroll-snap-align: start; }
      .cards { gap: 12px; }
      .cards .card h3 { font-size: 1.02rem; }
      .cards .card p { -webkit-line-clamp: 2; font-size: 0.9rem; }
      .cards .more-hint { display: none; }
      .tags { margin-top: 10px; }
    }
    .tag { padding: 3px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: #fff; }
    .tag-Sport { background: #b03b3b; }
    .filter-bar .btn.active[data-tag="Sport"] { background: #b03b3b; border-color: #b03b3b; }
    .tag-Exchange { background: #3b7a78; }
    .filter-bar .btn.active[data-tag="Exchange"] { background: #3b7a78; border-color: #3b7a78; }
    .tag-Internship { background: #c96f28; }
    .filter-bar .btn.active[data-tag="Internship"] { background: #c96f28; border-color: #c96f28; }
    .tag-Language { background: #2b4f81; }
    .filter-bar .btn.active[data-tag="Language"] { background: #2b4f81; border-color: #2b4f81; }
    .tag-SelfDev { background: #3b7737; }
    .filter-bar .btn.active[data-tag="SelfDev"] { background: #3b7737; border-color: #3b7737; }
    .tag-Education { background: #6d3bb0; }
    .filter-bar .btn.active[data-tag="Education"] { background: #6d3bb0; border-color: #6d3bb0; }
  </style>
</head>
<body data-page="growth">
  <!-- The burger menu is added automatically by assets/site.js -->

<header class="page-header has-image" style="--hero: url('https://i.imgur.com/mpBgo3X.jpeg')">
    <h1>Růst a vzdělávání</h1>
  </header>

  <main>
    <div class="wrap">
      <p class="intro"><em>„Věřím, že žijeme život, který si sami vytvoříme, a věřím v tvrdou práci. Každý den se snažím být o kousek lepší než včera a mířím k tomu stát se polyhistorem.“</em></p>
      <p class="quote" id="tagQuote">„Žij, jako bys měl zítra zemřít. Uč se, jako bys měl žít navždy.“ – Mahátma Gándhí</p>

      <div class="filter-bar">
        <button class="btn ghost active" type="button" data-tag="All">Vše</button>
        <button class="btn ghost" type="button" data-tag="Sport">Sport</button>
        <button class="btn ghost" type="button" data-tag="Exchange">Výměnný pobyt</button>
        <button class="btn ghost" type="button" data-tag="Internship">Stáž</button>
        <button class="btn ghost" type="button" data-tag="Language">Jazyky</button>
        <button class="btn ghost" type="button" data-tag="SelfDev">Seberozvoj</button>
        <button class="btn ghost" type="button" data-tag="Education">Vzdělání</button>
      </div>

      <div class="cards" id="cardContainer"></div>
    </div>
  </main>

  <footer class="site-footer">© 2026 Benjamin Hejda</footer>

  <script src="assets/site.js"></script>
  <script>
    // To add a card, copy one line below. Tag keys: Sport, Exchange, Internship, Language, SelfDev, Education
    const cardsData = [
      {"title":"Tetr College of Business","description":"Přijetí na Tetr College of Business – mezinárodní vysokoškolský program business studií, během kterého studenti studují v několika zemích. Momentálně studuji v Novém Dillí v Indii.","tags":["Education","Exchange","SelfDev"]},
      {"title":"IB Diploma – Gymnázium a SOŠ Rokycany","description":"V létě 2026 jsem úspěšně dokončil program International Baccalaureate Diploma se zaměřením na biologii, matematiku, dějepis a angličtinu.","tags":["Education","SelfDev"]},
      {"title":"Semestr v Ohiu, USA","description":"Půl roku jsem strávil na americké střední škole, ponořený do americké kultury a úplně jiného školního systému. Později jsem se vrátil za přáteli a na ples (prom).","tags":["Exchange","Language","SelfDev"]},
      {"title":"Výměna s Portugalskem – Aveiro a Rokycany","description":"Zúčastnil jsem se studentské výměny v portugalském Aveiru a poté pomáhal s programem pro portugalské studenty v Rokycanech, včetně naplánování a vedení výletu do Vojenského muzea.","tags":["Exchange","Language","SelfDev"]},
      {"title":"EuroWeek","description":"Spolupracoval jsem s více než 180 studenty z celé Evropy na kulturní výměně a týmových aktivitách. Přátelství vydržela – později jsem strávil Silvestr ve Francii u francouzské hostitelské rodiny.","tags":["Exchange","Language","SelfDev"]},
      {"title":"Ragby","description":"Jedenáct let ragby, včetně působení v jednom z nejlepších českých klubů – týmová spolupráce, odolnost, strategické myšlení a vůdčí návyky.","tags":["Sport","SelfDev"]},
      {"title":"Trénování mládeže v ragby","description":"Od roku 2022 dobrovolně trénuji mladé hráče – vedu je nejen v ragby, ale i k disciplíně, zodpovědnosti a týmové spolupráci.","tags":["Sport","SelfDev"]},
      {"title":"Rozhodčí na ragbyových turnajích","description":"Pískal jsem ragbyové turnaje a rozvíjel tak rychlé rozhodování, autoritu a zvládání konfliktů.","tags":["Sport","SelfDev"]},
      {"title":"Survival tábory a táborové programy","description":"Spoluorganizoval jsem survival tábory pro mladé ragbisty a vymýšlel hry a aktivity pro děti různého věku a různě velké skupiny – učili jsme samostatnost, spolupráci a praktické dovednosti v přírodě.","tags":["Internship","Sport","SelfDev"]},
      {"title":"Triatlon","description":"Dokončil jsem svůj první triatlon a teď trénuji plavání, kolo a běh s cílem zvládnout Ironman 70.3.","tags":["Sport","SelfDev"]},
      {"title":"Překážkové závody (OCR)","description":"Pravidelně závodím v OCR. Vrchol: Predator OCR Master Weekend – 30 km a více než 75 překážek.","tags":["Sport","SelfDev"]},
      {"title":"Běh a půlmaratony","description":"Běh je pro mě restart – mám za sebou několik půlmaratonů, které mě naučily vytrvalosti a psychické odolnosti.","tags":["Sport","SelfDev"]},
      {"title":"Jazyky","description":"Čeština (rodilý mluvčí), angličtina (plynně od dětství), němčina a portugalština (středně pokročilý), momentálně se učím norsky. Už od malička jsem pomáhal zahraničním návštěvníkům s komunikací, díky čemuž se cítím jistě v mezikulturním prostředí.","tags":["Language","SelfDev"]},
      {"title":"Stáž v armádě","description":"Cenné dovednosti a nový pohled na věc díky stáži u armády.","tags":["Internship","SelfDev"]},
      {"title":"Výměnný pobyt – Slovensko","description":"Účast na výměnném pobytu na Slovensku, kde jsem si rozšířil obzory díky spolupráci s místními studenty.","tags":["Exchange","Language","SelfDev"]},
      {"title":"Samostatné cestování do zahraničí","description":"Cestoval jsem do zahraničí sám – zvládal jsem logistiku, rychle se přizpůsoboval a domlouval se v neznámém prostředí.","tags":["SelfDev"]},
      {"title":"IT a jazyková podpora na dnech otevřených dveří","description":"Na dnech otevřených dveří gymnázia v Rokycanech jsem zajišťoval IT podporu, pomáhal přednášejícím s technikou a tlumočil do angličtiny pro ty, kdo to potřebovali.","tags":["Internship","Language","SelfDev"]},
      {"title":"Dobrovolnictví a IASE 2024","description":"Dobrovolník na konferenci International Association of Special Education (IASE) 2024; pravidelně také pomáhám na školních a komunitních akcích.","tags":["SelfDev","Education"]},
      {"title":"Jaderné dny v Praze","description":"Účast na Jaderných dnech (Nuclear Days) – vědecké přednášky, které prohloubily můj zájem o energetiku a fyziku.","tags":["Education"]},
      {"title":"Pochod Praha–Prčice","description":"Ušel jsem slavnou 80km trasu Praha–Prčice – zkouška vytrvalosti a lásky k výzvám v přírodě.","tags":["Sport","SelfDev"]},
      {"title":"Americký fotbal","description":"Hrál jsem americký fotbal – týmová spolupráce, koordinace, soutěživost a skutečný vhled do americké kultury.","tags":["Sport","Exchange","SelfDev"]},
      {"title":"Cheerleading","description":"Nedávno jsem začal s cheerleadingem – koordinace, týmová spolupráce a vystupování v úplně novém sportu.","tags":["Sport","SelfDev"]},
      {"title":"Kalistenika","description":"Silový trénink s vlastní vahou pro funkční kondici a disciplínu.","tags":["Sport","SelfDev"]},
      {"title":"Zápas","description":"Trénink zápasu pro sílu, strategii a vytrvalost.","tags":["Sport","SelfDev"]},
      {"title":"Krav Maga","description":"Rok Krav Magy pro sebeobranu, sebevědomí a psychickou odolnost.","tags":["Sport","SelfDev"]},
      {"title":"Komparz v televizních minisériích","description":"Hrál jsem komparz ve dvou minisériích – jednou jako ministrant, jednou jako ragbista.","tags":["SelfDev"]},
      {"title":"Církevní gymnázium","description":"Absolvování nižšího stupně gymnázia, kde jsem si vybudoval pevné studijní návyky a disciplínu.","tags":["Education"]}
    ];
    
    const TAG_LABELS = {"Sport":"Sport","Exchange":"Výměnný pobyt","Internship":"Stáž","Language":"Jazyky","SelfDev":"Seberozvoj","Education":"Vzdělání"};
    const QUOTES = {
      "Sport": "„Tělesná zdatnost není jen jedním z nejdůležitějších klíčů ke zdravému tělu, je základem dynamické a tvořivé duševní činnosti.“ – John F. Kennedy",
      "Exchange": "„Cestování je smrtelné pro předsudky, bigotnost a úzkoprsost.“ – Mark Twain",
      "Internship": "„Budoucnost nemůžeme předpovědět, ale můžeme ji vynalézt.“ – Dennis Gabor",
      "Language": "„Naučit se jazyk znamená mít další okno, kterým se díváme na svět.“ – Čínské přísloví",
      "SelfDev": "„Kdo zvítězí sám nad sebou, je nejmocnější válečník.“ – Konfucius",
      "Education": "„Vzdělání není učení se faktům, ale výcvik mysli k myšlení.“ – Albert Einstein"
    };
    const DEFAULT_QUOTE = "„Žij, jako bys měl zítra zemřít. Uč se, jako bys měl žít navždy.“ – Mahátma Gándhí";
    const MORE = "Více →";
    const esc = Site.escape;
    const tagHtml = tags => tags.map(t => '<span class="tag tag-' + t + '">' + TAG_LABELS[t] + '</span>').join('');
    
    const container = document.getElementById('cardContainer');
    container.innerHTML = cardsData.map((c, i) =>
      '<button class="card clickable" type="button" data-index="' + i + '" data-tags="' + c.tags.join(' ') + '">' +
      '<h3>' + esc(c.title) + '</h3><p>' + esc(c.description) + '</p>' +
      '<div class="tags">' + tagHtml(c.tags) + '</div><div class="more-hint">' + MORE + '</div></button>'
    ).join('');
    
    container.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card) return;
      const c = cardsData[card.dataset.index];
      Site.openModal('<div class="modal-content"><h2>' + esc(c.title) + '</h2><p>' + esc(c.description) + '</p><div class="tags">' + tagHtml(c.tags) + '</div></div>');
    });
    
    document.querySelectorAll('.filter-bar .btn').forEach(btn => btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      document.querySelectorAll('.filter-bar .btn').forEach(b => b.classList.toggle('active', b === btn));
      container.querySelectorAll('.card').forEach(card => {
        card.hidden = !(tag === 'All' || card.dataset.tags.split(' ').includes(tag));
      });
      document.getElementById('tagQuote').textContent = tag === 'All' ? DEFAULT_QUOTE : QUOTES[tag];
    }));
  </script>
</body>
</html>
