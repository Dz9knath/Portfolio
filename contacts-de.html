<!DOCTYPE html>
<html lang="de" data-lang="de">
<head>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230066cc'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EBH%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .contact-card { display: flex; flex-wrap: wrap; gap: 40px; align-items: center; justify-content: center; }
    .profile-pic img { width: 200px; height: 200px; object-fit: cover; border-radius: 50%; display: block; box-shadow: var(--shadow); }
    .contacts { flex: 1 1 300px; }
    .contact-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 1.1rem; }
    .contact-item:last-child { border-bottom: none; }
    .contact-item i { width: 28px; text-align: center; font-size: 1.35rem; color: var(--blue); }
    .contact-item a { color: var(--ink); text-decoration: none; word-break: break-word; }
    .contact-item a:hover { color: var(--blue); text-decoration: underline; }
  </style>
</head>
<body data-page="contacts">
  <!-- The burger menu is added automatically by assets/site.js -->

<header class="page-header">
    <h1>Kontakt</h1>
    <p class="lead">Am besten erreichst du mich per E-Mail oder über LinkedIn.</p>
  </header>

  <main>
    <div class="wrap-narrow">
      <div class="card contact-card">
        <div class="profile-pic">
          <img src="https://i.imgur.com/M9ceOaE.jpeg" alt="Benjamin Hejda">
        </div>
        <div class="contacts">
          <div class="contact-item"><i class="fas fa-envelope" aria-hidden="true"></i><a href="mailto:ben.hejda@gmail.com">ben.hejda@gmail.com</a></div>
          <div class="contact-item"><i class="fab fa-linkedin" aria-hidden="true"></i><a href="https://www.linkedin.com/in/benjamin-hejda" target="_blank" rel="noopener">linkedin.com/in/benjamin-hejda</a></div>
          <div class="contact-item"><i class="fab fa-instagram" aria-hidden="true"></i><a href="https://www.instagram.com/ben.hejda/" target="_blank" rel="noopener">@ben.hejda</a></div>
          <div class="contact-item"><i class="fab fa-facebook" aria-hidden="true"></i><a href="https://www.facebook.com/benhejda/" target="_blank" rel="noopener">Benjamin Hejda</a></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">© 2026 Benjamin Hejda</footer>

  <script src="assets/site.js"></script>
