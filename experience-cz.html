<!DOCTYPE html>
<html lang="cs" data-lang="cz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zkušenosti | Benjamin Hejda</title>
  <meta name="description" content="Zkušenosti – portfolio Benjamina Hejdy, českého studenta, sportovce a dobrodruha." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230066cc'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EBH%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    .jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .job .icon { font-size: 1.8rem; line-height: 1; margin-bottom: 12px; }
    .job h2 { font-size: 1.2rem; margin-bottom: 4px; }
    .job .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    .job p { color: #3a414a; }
    .skill-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin-top: 16px; }
    @media (max-width: 600px) {
      .jobs { grid-template-columns: 1fr; gap: 12px; }
      .job { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; }
      .job .icon { grid-row: span 4; font-size: 1.6rem; margin: 2px 0 0; }
      .job h2 { font-size: 1.08rem; }
      .job .meta { margin-bottom: 8px; font-size: 0.85rem; }
      .job p { font-size: 0.93rem; }
      .job .more-hint { margin-top: 8px; }
    }
    .modal-content .meta a { color: inherit; }
  </style>
</head>
<body data-page="experience">
  <!-- The burger menu is added automatically by assets/site.js -->

<header class="page-header has-image" style="--hero: url('https://i.imgur.com/Tpt260a.jpeg')">
    <h1>Zkušenosti</h1>
    <p class="lead">Klikněte na kartu a zobrazí se celý příběh.</p>
  </header>

  <main>
    <div class="wrap">
      <div class="jobs" id="jobs"></div>
    </div>
  </main>

  <footer class="site-footer">© 2026 Benjamin Hejda</footer>

  <script src="assets/site.js"></script>
  <script>
    // Each job: short "summary" shows on the card, "details" + "image" show when clicked.
    const jobs = [
      {"icon":"🏉","role":"Dobrovolný trenér ragby","org":"Ragby Plzeň","link":"https://www.ragbyplzen.cz/","period":"2022–současnost","summary":"Trénuji tým 10–12letých dětí v plzeňském ragbyovém klubu.","details":"Trénuji tým 10–12letých dětí se zaměřením na rozvoj dovedností, disciplínu a týmového ducha. Zorganizoval jsem také dva survival tábory, kde se děti zábavnou a náročnou formou naučily základní dovednosti v přírodě i v týmu. Fotka je z mého prvního turnaje v roli trenéra.","skills":["Mentoring mládeže","Vedení týmu","Tvorba programu"],"image":"https://i.imgur.com/43lO1pf.jpeg"},
      {"icon":"🏕️","role":"Trenér a táborový animátor","org":"Rugby Academy Yves Perrot (RAYP)","link":"https://www.sportbezpredsudku.cz/ragbyova-akademie-yvese-perrota/","period":"Sezónně","summary":"Pomáhám s tréninky a chodem tábora na ragbyové akademii pro děti.","details":"Pomáhám vést tréninky dětí různých věkových kategorií a podílím se na každodenním chodu tábora – od ranních tréninků po večerní hry. Připravuji dynamické aktivity, které učí odolnosti a spolupráci.","skills":["Koučink","Organizace táborů","Práce s dětmi"],"image":"https://i.imgur.com/jLSE58G.jpeg"},
      {"icon":"🎯","role":"Člen personálu","org":"Paintball Arena (PPA)","link":"https://www.pparena.com/","period":"2023–současnost","summary":"Hry, vybavení a bezpečnostní instruktáže v paintballové aréně.","details":"Starám se o zákazníky během her, vydávám vybavení a vedu bezpečnostní instruktáže. Je to rychlé prostředí, takže přátelský přístup a pohotové řešení problémů jsou základ.","skills":["Zákaznický servis","Práce s vybavením","Řešení problémů"],"image":null},
      {"icon":"🍴","role":"Event marketing a catering","org":"4PRO","link":"https://www.4pro.cz/","period":"2024–současnost","summary":"Stánky s jídlem a pitím na fotbalových zápasech, koncertech a akcích.","details":"Pomáhám organizovat a provozovat stánky s jídlem a pitím na fotbalových zápasech, koncertech a dalších akcích. Důležitá je rychlá a přátelská obsluha i při velkém náporu – často u toho zvládám i přípravu nebo úklid.","skills":["Organizace akcí","Gastro služby","Týmová práce pod tlakem"],"image":null},
      {"icon":"🎸","role":"Prodej / podpora","org":"Různé koncerty a festivaly","link":null,"period":"Příležitostně","summary":"Prodej jídla a pití a pomoc se stavbou na koncertech a festivalech.","details":"Na různých koncertech a festivalech prodávám jídlo a pití, obsluhuji velmi pestré publikum, přijímám hotovostní i mobilní platby a pomáhám se stavbou dočasného zázemí akcí.","skills":["Prodej","Festivalová logistika","Přizpůsobivost"],"image":null}
    ];
    const MORE = "Více →";
    const esc = Site.escape;
    const list = document.getElementById('jobs');
    
    list.innerHTML = jobs.map((j, i) =>
      '<button class="card clickable job" type="button" data-index="' + i + '">' +
      '<div class="icon">' + j.icon + '</div>' +
      '<h2>' + esc(j.role) + '</h2>' +
      '<div class="meta">' + esc(j.org) + ' · ' + esc(j.period) + '</div>' +
      '<p>' + esc(j.summary) + '</p>' +
      '<div class="more-hint">' + MORE + '</div></button>'
    ).join('');
    
    list.addEventListener('click', e => {
      const card = e.target.closest('.job');
      if (!card) return;
      const j = jobs[card.dataset.index];
      const org = j.link ? '<a href="' + j.link + '" target="_blank" rel="noopener">' + esc(j.org) + ' ↗</a>' : esc(j.org);
      Site.openModal(
        (j.image ? '<img class="modal-img" src="' + j.image + '" alt="' + esc(j.role) + '">' : '') +
        '<div class="modal-content"><h2>' + j.icon + ' ' + esc(j.role) + '</h2>' +
        '<div class="sub meta">' + org + ' · ' + esc(j.period) + '</div>' +
        '<p>' + esc(j.details) + '</p>' +
        '<ul class="skill-list">' + j.skills.map(s => '<li class="pill">' + esc(s) + '</li>').join('') + '</ul></div>'
      );
    });
  </script>
</body>
</html>
