<!DOCTYPE html>
<html lang="pt" data-lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria | Benjamin Hejda</title>
  <meta name="description" content="Galeria – portfólio de Benjamin Hejda, estudante, atleta e explorador checo." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230066cc'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EBH%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    .gallery { column-count: 2; column-gap: 10px; }
    @media (max-width: 599px) { .gallery-item { margin-bottom: 10px; border-radius: 8px; } .gallery-item figcaption { font-size: 0.78rem; padding: 22px 8px 7px; line-height: 1.3; } }
    @media (min-width: 900px) { .gallery { column-count: 3; } }
    @media (min-width: 1300px) { .gallery { column-count: 4; } }
    .gallery-item { position: relative; display: block; width: 100%; margin-bottom: 16px; padding: 0; border: none; border-radius: 10px; overflow: hidden; break-inside: avoid; cursor: zoom-in; background: #ddd; }
    .gallery-item img { width: 100%; display: block; transition: transform 0.35s ease; }
    .gallery-item figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; color: #fff; font-weight: 600; text-align: left; background: linear-gradient(transparent, rgba(0, 0, 0, 0.7)); opacity: 0; transition: opacity 0.3s ease; }
    .gallery-item:hover img, .gallery-item:focus-visible img { transform: scale(1.04); }
    .gallery-item:hover figcaption, .gallery-item:focus-visible figcaption { opacity: 1; }
    @media (hover: none) { .gallery-item figcaption { opacity: 1; } }
    .gallery-wrap { max-width: 1400px; margin: 0 auto; }
  </style>
</head>
<body data-page="gallery">
  <!-- The burger menu is added automatically by assets/site.js -->

<header class="page-header">
    <h1>Galeria</h1>
    <p class="lead">Clique numa foto para a ver maior.</p>
  </header>

  <main>
    <div class="gallery-wrap">
      <div class="gallery">
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/k0N1tTc.jpeg">
          <img src="https://i.imgur.com/k0N1tTc.jpeg" alt="O meu primeiro triatlo" loading="lazy">
          <figcaption>O meu primeiro triatlo</figcaption>
        </figure>
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/gECqNYq.jpeg">
          <img src="https://i.imgur.com/gECqNYq.jpeg" alt="Semestre em Ohio, EUA" loading="lazy">
          <figcaption>Semestre em Ohio, EUA</figcaption>
        </figure>
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/phbQO4i.jpeg">
          <img src="https://i.imgur.com/phbQO4i.jpeg" alt="Voluntariado na IASE 2024" loading="lazy">
          <figcaption>Voluntariado na IASE 2024</figcaption>
        </figure>
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/3qTckOr.jpeg">
          <img src="https://i.imgur.com/3qTckOr.jpeg" alt="Programa de intercâmbio em Aveiro, Portugal" loading="lazy">
          <figcaption>Programa de intercâmbio em Aveiro, Portugal</figcaption>
        </figure>
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/43lO1pf.jpeg">
          <img src="https://i.imgur.com/43lO1pf.jpeg" alt="O meu primeiro torneio como treinador" loading="lazy">
          <figcaption>O meu primeiro torneio como treinador</figcaption>
        </figure>
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/BrPiljt.jpeg">
          <img src="https://i.imgur.com/BrPiljt.jpeg" alt="Conclusão do Ensino Secundário" loading="lazy">
          <figcaption>Conclusão do Ensino Secundário</figcaption>
        </figure>
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/GTKJ5c5.jpeg">
          <img src="https://i.imgur.com/GTKJ5c5.jpeg" alt="Estágio Militar" loading="lazy">
          <figcaption>Estágio Militar</figcaption>
        </figure>
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/7g5iTwK.jpeg">
          <img src="https://i.imgur.com/7g5iTwK.jpeg" alt="A minha segunda meia maratona" loading="lazy">
          <figcaption>A minha segunda meia maratona</figcaption>
        </figure>
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/Q5zDYBd.jpeg">
          <img src="https://i.imgur.com/Q5zDYBd.jpeg" alt="Predator OCR Master Weekend" loading="lazy">
          <figcaption>Predator OCR Master Weekend</figcaption>
        </figure>
        <figure class="gallery-item" tabindex="0" role="button" data-src="https://i.imgur.com/jLSE58G.jpeg">
          <img src="https://i.imgur.com/jLSE58G.jpeg" alt="Treinar rugby na Académie de Rugby Yves Perrot, 2025" loading="lazy">
          <figcaption>Treinar rugby na Académie de Rugby Yves Perrot, 2025</figcaption>
        </figure>
      </div>
    </div>
  </main>

  <footer class="site-footer">© 2026 Benjamin Hejda</footer>

  <script src="assets/site.js"></script>
  <script>
    // To add a photo, copy a <figure> block above and change the image link and caption.
    function openPhoto(item) {
      const caption = item.querySelector('figcaption').textContent;
      Site.openModal('<img class="modal-img" src="' + item.dataset.src + '" alt="' + Site.escape(caption) + '"><div class="modal-content"><h2>' + Site.escape(caption) + '</h2></div>', { wide: true });
    }
    document.querySelectorAll('.gallery-item').forEach(item => {
      item.addEventListener('click', () => openPhoto(item));
      item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPhoto(item); } });
    });
  </script>
</body>
</html>
