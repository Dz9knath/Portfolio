<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts | Benjamin Hejda</title>
  <meta name="description" content="Contacts – portfolio of Benjamin Hejda, a Czech student, athlete and explorer." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230066cc'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EBH%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .contact-card { display: flex; flex-wrap: wrap; gap: 40px; align-items: center; justify-content: center; }
    .profile-pic img { width: 200px; height: 200px; object-fit: cover; border-radius: 50%; display: block; box-shadow: var(--shadow); }
    .contacts { flex: 1 1 300px; }
    .contact-item { display: flex; align-items: center; gap: 14px; padding: 14px 4px; min-height: 52px; border-bottom: 1px solid var(--line); font-size: 1.1rem; color: var(--ink); text-decoration: none; border-radius: 8px; }
    .contact-item:hover { background: var(--bg); color: var(--blue); }
    .contact-item:last-child { border-bottom: none; }
    .contact-item i { width: 28px; text-align: center; font-size: 1.35rem; color: var(--blue); }
    .contact-item span { word-break: break-word; }
    @media (max-width: 600px) {
      .contact-card { gap: 20px; }
      .profile-pic img { width: 140px; height: 140px; }
      .contact-item { font-size: 1rem; }
    }
  </style>
</head>
<body data-page="contacts">
  <!-- The burger menu is added automatically by assets/site.js -->

<header class="page-header">
    <h1>Contacts</h1>
    <p class="lead">The best way to reach me is by email or LinkedIn.</p>
  </header>

  <main>
    <div class="wrap-narrow">
      <div class="card contact-card">
        <div class="profile-pic">
          <img src="https://i.imgur.com/M9ceOaE.jpeg" alt="Benjamin Hejda">
        </div>
        <div class="contacts">
          <a class="contact-item" href="mailto:ben.hejda@gmail.com"><i class="fas fa-envelope" aria-hidden="true"></i><span>ben.hejda@gmail.com</span></a>
          <a class="contact-item" href="https://www.linkedin.com/in/benjamin-hejda" target="_blank" rel="noopener"><i class="fab fa-linkedin" aria-hidden="true"></i><span>linkedin.com/in/benjamin-hejda</span></a>
          <a class="contact-item" href="https://www.instagram.com/ben.hejda/" target="_blank" rel="noopener"><i class="fab fa-instagram" aria-hidden="true"></i><span>@ben.hejda</span></a>
          <a class="contact-item" href="https://www.facebook.com/benhejda/" target="_blank" rel="noopener"><i class="fab fa-facebook" aria-hidden="true"></i><span>Benjamin Hejda</span></a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">© 2026 Benjamin Hejda</footer>

  <script src="assets/site.js"></script>

</html>
