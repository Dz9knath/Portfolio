<!DOCTYPE html>
<html lang="de" data-lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Berufserfahrung | Benjamin Hejda</title>
  <meta name="description" content="Berufserfahrung – Portfolio von Benjamin Hejda, tschechischer Student, Sportler und Entdecker." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230066cc'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EBH%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    .jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .job .icon { font-size: 1.8rem; line-height: 1; margin-bottom: 12px; }
    .job h2 { font-size: 1.2rem; margin-bottom: 4px; }
    .job .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    .job p { color: #3a414a; }
    .skill-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin-top: 16px; }
    @media (max-width: 600px) {
      .jobs { grid-template-columns: 1fr; gap: 12px; }
      .job { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; }
      .job .icon { grid-row: span 4; font-size: 1.6rem; margin: 2px 0 0; }
      .job h2 { font-size: 1.08rem; }
      .job .meta { margin-bottom: 8px; font-size: 0.85rem; }
      .job p { font-size: 0.93rem; }
      .job .more-hint { margin-top: 8px; }
    }
    .modal-content .meta a { color: inherit; }
  </style>
</head>
<body data-page="experience">
  <!-- The burger menu is added automatically by assets/site.js -->

<header class="page-header has-image" style="--hero: url('https://i.imgur.com/Tpt260a.jpeg')">
    <h1>Berufserfahrung</h1>
    <p class="lead">Klicke auf eine Karte, um alles zu lesen.</p>
  </header>

  <main>
    <div class="wrap">
      <div class="jobs" id="jobs"></div>
    </div>
  </main>

  <footer class="site-footer">© 2026 Benjamin Hejda</footer>

  <script src="assets/site.js"></script>
  <script>
    // Each job: short "summary" shows on the card, "details" + "image" show when clicked.
    const jobs = [
      {"icon":"🏉","role":"Ehrenamtlicher Rugby-Trainer","org":"Ragby Plzeň","link":"https://www.ragbyplzen.cz/","period":"2022–heute","summary":"Ich trainiere eine Mannschaft von 10- bis 12-Jährigen in meinem Rugbyverein in Pilsen.","details":"Ich trainiere eine Mannschaft von 10- bis 12-Jährigen mit Schwerpunkt auf Technik, Disziplin und Teamgeist. Außerdem habe ich zwei Survival-Camps organisiert, in denen die Kinder spielerisch wichtige Outdoor- und Teamfähigkeiten gelernt haben. Das Foto stammt von meinem ersten Turnier als Trainer.","skills":["Jugendbetreuung","Teamführung","Programmentwicklung"],"image":"https://i.imgur.com/43lO1pf.jpeg"},
      {"icon":"🏕️","role":"Trainer & Camp-Animator","org":"Rugby Academy Yves Perrot (RAYP)","link":"https://www.sportbezpredsudku.cz/ragbyova-akademie-yvese-perrota/","period":"Saisonal","summary":"Ich unterstütze Training und Camp-Alltag an einer Rugby-Akademie für Kinder.","details":"Ich leite das Training von Kindern verschiedener Altersgruppen mit und begleite den Camp-Alltag – vom Morgentraining bis zu den Abendspielen. Dabei entwickle ich abwechslungsreiche Aktivitäten, die Belastbarkeit und Zusammenarbeit fördern.","skills":["Training","Camp-Organisation","Kinderbetreuung"],"image":"https://i.imgur.com/jLSE58G.jpeg"},
      {"icon":"🎯","role":"Mitarbeiter","org":"Paintball Arena (PPA)","link":"https://www.pparena.com/","period":"2023–heute","summary":"Spiele, Ausrüstung und Sicherheitseinweisungen in einer Paintball-Arena.","details":"Ich betreue Kunden während der Spiele, kümmere mich um die Ausrüstung und gebe Sicherheitseinweisungen. In dem schnellen Umfeld kommt es auf freundlichen Service und schnelle Lösungen an.","skills":["Kundenservice","Ausrüstungsmanagement","Problemlösung"],"image":null},
      {"icon":"🍴","role":"Eventmarketing & Catering","org":"4PRO","link":"https://www.4pro.cz/","period":"2024–heute","summary":"Essens- und Getränkestände bei Fußballspielen, Konzerten und Events.","details":"Ich helfe bei der Organisation und dem Betrieb von Essens- und Getränkeständen bei Fußballspielen, Konzerten und anderen Veranstaltungen. Im Mittelpunkt steht schneller, freundlicher Service bei großem Andrang – oft parallel zu Auf- und Abbau.","skills":["Eventorganisation","Gastronomie","Teamarbeit unter Druck"],"image":null},
      {"icon":"🎸","role":"Verkauf / Support","org":"Verschiedene Konzerte & Festivals","link":null,"period":"Gelegentlich","summary":"Verkauf von Essen und Getränken und Aufbauhilfe bei Konzerten und Festivals.","details":"Bei verschiedenen Konzerten und Festivals verkaufe ich Speisen und Getränke, bediene ein sehr gemischtes Publikum, wickle Bar- und Kartenzahlungen ab und helfe beim Aufbau der temporären Infrastruktur.","skills":["Verkauf","Festival-Logistik","Anpassungsfähigkeit"],"image":null}
    ];
    const MORE = "Mehr →";
    const esc = Site.escape;
    const list = document.getElementById('jobs');
    
    list.innerHTML = jobs.map((j, i) =>
      '<button class="card clickable job" type="button" data-index="' + i + '">' +
      '<div class="icon">' + j.icon + '</div>' +
      '<h2>' + esc(j.role) + '</h2>' +
      '<div class="meta">' + esc(j.org) + ' · ' + esc(j.period) + '</div>' +
      '<p>' + esc(j.summary) + '</p>' +
      '<div class="more-hint">' + MORE + '</div></button>'
    ).join('');
    
    list.addEventListener('click', e => {
      const card = e.target.closest('.job');
      if (!card) return;
      const j = jobs[card.dataset.index];
      const org = j.link ? '<a href="' + j.link + '" target="_blank" rel="noopener">' + esc(j.org) + ' ↗</a>' : esc(j.org);
      Site.openModal(
        (j.image ? '<img class="modal-img" src="' + j.image + '" alt="' + esc(j.role) + '">' : '') +
        '<div class="modal-content"><h2>' + j.icon + ' ' + esc(j.role) + '</h2>' +
        '<div class="sub meta">' + org + ' · ' + esc(j.period) + '</div>' +
        '<p>' + esc(j.details) + '</p>' +
        '<ul class="skill-list">' + j.skills.map(s => '<li class="pill">' + esc(s) + '</li>').join('') + '</ul></div>'
      );
    });
  </script>
</body>
</html>
