<!DOCTYPE html>
<html lang="de" data-lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Benjamin Hejda</title>
  <meta name="description" content="Blog – Portfolio von Benjamin Hejda, tschechischer Student, Sportler und Entdecker." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230066cc'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EBH%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    .intro { margin-bottom: 20px; font-size: 1.05rem; }
    .search-bar { margin-bottom: 24px; }
    .search-bar input { width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fff; }
    .post { margin-bottom: 16px; }
    .post-title { color: var(--blue); font-size: 1.4rem; margin-bottom: 8px; }
    .post-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .post img, .single-post img { border-radius: 8px; margin: 12px 0; }
    .single-post h1 { color: var(--blue); font-size: 2rem; margin-bottom: 12px; }
    .single-post .content { font-size: 1.08rem; }
    .related-posts { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 20px; }
    .related-posts h3 { margin-bottom: 10px; }
    .related-post { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 10px 14px; background: var(--bg); border: none; border-radius: 8px; cursor: pointer; font: inherit; }
    .related-post:hover { background: #e7ebf0; }
    .nav-arrows { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
    .back-row { margin-top: 16px; }
    .empty { text-align: center; color: var(--muted); }
  </style>
</head>
<body data-page="blog">
  <!-- The burger menu is added automatically by assets/site.js -->

<header class="page-header">
    <h1>Blog</h1>
  </header>

  <main>
    <div class="wrap-narrow" id="blogContainer"></div>
  </main>

  <footer class="site-footer">© 2026 Benjamin Hejda</footer>

  <script src="assets/site.js"></script>
  <script>
    // Add new posts at the TOP of this list.
    const posts = [
      {
        "title": "Willkommen auf meinem Blog",
        "date": "13.8.2025",
        "readTime": "2 Min.",
        "image": "",
        "tags": [
          "Einführung",
          "Persönliche Entwicklung",
          "Bildung",
          "Leben"
        ],
        "content": "Willkommen! Dieser Blog wird mein Ort sein, um zu teilen, was in meinem Leben passiert – vor allem rund um persönliche Entwicklung und Sport. Ich schreibe darüber, wie ich mich weiterentwickle, was ich verändere, welche Ziele ich habe, wie sie sich verändern und welche Schritte ich unternehme, um sie zu erreichen. Du kannst auch Beiträge über die Schule erwarten – über meine aktuelle Zeit auf dem Gymnasium oder vielleicht später an der Universität – sowie interessante Gedanken und Dinge, die mir unterwegs auffallen. Ich hoffe, du hast Freude daran, meine Reise zu verfolgen, und findest vielleicht Inspiration für deine eigene."
      }
    ];
    const UI = {"h":"Mein Blog","intro":"Hallo und willkommen auf meinem Blog! Hier findest du meine neuesten Beiträge, Gedanken und Updates. Klicke auf einen Beitrag, um ihn vollständig zu lesen, und wechsle mit den Pfeilen zwischen den Beiträgen.","search":"Beiträge suchen…","related":"Ähnliche Beiträge","prev":"← Zurück","next":"Weiter →","back":"Zurück zum Blog","none":"Keine Beiträge gefunden."};
    const esc = Site.escape;
    const container = document.getElementById('blogContainer');
    let currentPost = null;
    
    const meta = p => '<div class="post-meta"><span>' + esc(p.date) + '</span>·<span>' + esc(p.readTime) + '</span>·' +
      p.tags.map(t => '<span class="pill">' + esc(t) + '</span>').join('') + '</div>';
    
    function renderList() {
      currentPost = null;
      container.innerHTML =
        '<h2 class="section-title" style="font-size:1.6rem;margin-bottom:12px">' + UI.h + '</h2>' +
        '<p class="intro">' + UI.intro + '</p>' +
        '<div class="search-bar"><input type="search" id="searchInput" placeholder="' + UI.search + '" aria-label="' + UI.search + '"></div>' +
        '<div id="postList">' + posts.map((p, i) =>
          '<button class="card clickable post" type="button" data-index="' + i + '">' +
          '<h3 class="post-title">' + esc(p.title) + '</h3>' + meta(p) +
          (p.image ? '<img src="' + p.image + '" alt="' + esc(p.title) + '">' : '') +
          '<p>' + esc(p.content.substring(0, 140)) + '…</p></button>').join('') +
        '</div><p class="empty" id="noPosts" hidden>' + UI.none + '</p>';
      document.getElementById('searchInput').addEventListener('input', filterPosts);
    }
    
    function showPost(index) {
      currentPost = index;
      const p = posts[index];
      const related = posts.map((x, i) => ({ ...x, i }))
        .filter(x => x.i !== index && x.tags.some(t => p.tags.includes(t))).slice(0, 3);
      container.innerHTML =
        '<article class="card single-post"><h1>' + esc(p.title) + '</h1>' + meta(p) +
        (p.image ? '<img src="' + p.image + '" alt="' + esc(p.title) + '">' : '') +
        '<div class="content"><p>' + esc(p.content) + '</p></div>' +
        (related.length ? '<div class="related-posts"><h3>' + UI.related + '</h3>' +
          related.map(r => '<button class="related-post" type="button" data-index="' + r.i + '">' + esc(r.title) + '</button>').join('') + '</div>' : '') +
        '<div class="nav-arrows"><button class="btn" type="button" id="prevPost"' + (index === 0 ? ' disabled' : '') + '>' + UI.prev + '</button>' +
        '<button class="btn" type="button" id="nextPost"' + (index === posts.length - 1 ? ' disabled' : '') + '>' + UI.next + '</button></div>' +
        '<div class="back-row"><button class="btn ghost" type="button" id="backBtn">' + UI.back + '</button></div></article>';
      document.getElementById('prevPost').onclick = () => index > 0 && showPost(index - 1);
      document.getElementById('nextPost').onclick = () => index < posts.length - 1 && showPost(index + 1);
      document.getElementById('backBtn').onclick = renderList;
      window.scrollTo({ top: 0 });
    }
    
    function filterPosts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      let shown = 0;
      document.querySelectorAll('#postList .post').forEach(el => {
        const p = posts[el.dataset.index];
        const hit = (p.title + ' ' + p.content + ' ' + p.tags.join(' ')).toLowerCase().includes(q);
        el.hidden = !hit; if (hit) shown++;
      });
      document.getElementById('noPosts').hidden = shown > 0;
    }
    
    container.addEventListener('click', e => {
      const el = e.target.closest('.post, .related-post');
      if (el) showPost(Number(el.dataset.index));
    });
    
    renderList();
  </script>
</body>
</html>
